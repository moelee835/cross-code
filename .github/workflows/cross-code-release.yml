name: Cross Code prerelease

on:
  push:
    tags: ["cross-code-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'moelee835/cross-code'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run migration --check
        working-directory: packages/core
      - run: bun run script/test.ts test/session-runner.test.ts test/session-prompt.test.ts
        working-directory: packages/core
      - run: bun test test/session-messaging.test.ts
        working-directory: packages/server
      - run: bun run check:generated
        working-directory: packages/client

  build:
    if: github.repository == 'moelee835/cross-code'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      CROSS_CODE_BUILD: "1"
      OPENCODE_CHANNEL: cross-code
      OPENCODE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the CLI
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export OPENCODE_VERSION="${GITHUB_REF_NAME#cross-code-v}"
          else
            export OPENCODE_VERSION="0.0.0-cross-code-$GITHUB_RUN_NUMBER"
          fi
          bun run --cwd packages/cli script/build.ts --skip-install --skip-web-ui
      - name: Verify the CLI and two TUI sessions
        shell: bash
        run: |
          binary="packages/cli/dist/cli-$OPENCODE_TARGET/bin/cross-code"
          "$binary" --version
          "$binary" session send --help
          python3 script/test-cross-code.py "$binary"
      - name: Pack the CLI
        shell: bash
        run: |
          binary="packages/cli/dist/cli-$OPENCODE_TARGET/bin/cross-code"
          mkdir -p artifacts
          tar -czf "artifacts/cross-code-$OPENCODE_TARGET.tar.gz" -C "$(dirname "$binary")" cross-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-code-${{ matrix.target }}
          path: artifacts/*.tar.gz

  release:
    if: github.repository == 'moelee835/cross-code' && github.ref_type == 'tag'
    needs: [check, build]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cross-code-*
          path: artifacts
          merge-multiple: true
      - name: Publish binaries and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd artifacts && sha256sum cross-code-*.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file CROSS-CODE.md artifacts/*.tar.gz artifacts/SHA256SUMS
