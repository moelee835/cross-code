name: Cross Code CI and release

on:
  push:
    branches: [dev]
    tags: ["cross-code-v*"]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-code-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Cross Code checks
    if: github.repository == 'moelee835/cross-code'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run migration --check
        working-directory: packages/core
      - run: bun run script/test.ts test/session-runner.test.ts test/session-prompt.test.ts
        working-directory: packages/core
      - run: bun test test/session-messaging.test.ts
        working-directory: packages/server
      - run: bun run check:generated
        working-directory: packages/client
      - run: bun test test/cross-code-update.test.ts
        working-directory: packages/cli
      - run: bun test --timeout 30000 test/component/dialog-product-tour.test.tsx
        working-directory: packages/tui

  version:
    if: github.repository == 'moelee835/cross-code'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#cross-code-v}"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/dev" ]]; then
            version="0.1.1-dev.$GITHUB_RUN_NUMBER"
          else
            version="0.0.0-cross-code.$GITHUB_RUN_NUMBER"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid Cross Code version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Cross Code build (${{ matrix.target }})
    if: github.repository == 'moelee835/cross-code'
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    env:
      CROSS_CODE_BUILD: "1"
      OPENCODE_CHANNEL: cross-code
      OPENCODE_TARGET: ${{ matrix.target }}
      OPENCODE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build the CLI
        run: bun run --cwd packages/cli script/build.ts --skip-install --skip-web-ui
      - name: Verify the CLI and two TUI sessions
        shell: bash
        run: |
          binary="packages/cli/dist/cli-$OPENCODE_TARGET/bin/cross-code"
          test "$("$binary" --version)" = "cross-code v$OPENCODE_VERSION"
          "$binary" session send --help
          "$binary" upgrade --help
          python3 script/test-cross-code.py "$binary"
      - name: Pack the CLI
        shell: bash
        run: |
          binary="packages/cli/dist/cli-$OPENCODE_TARGET/bin/cross-code"
          mkdir -p artifacts
          tar -czf "artifacts/cross-code-$OPENCODE_TARGET.tar.gz" -C "$(dirname "$binary")" cross-code LICENSE.opencode-gemini-auth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-code-${{ matrix.target }}
          path: artifacts/*.tar.gz
          overwrite: true
          if-no-files-found: error

  release:
    if: github.repository == 'moelee835/cross-code' && github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag')
    needs: [check, build, version]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cross-code-*
          path: artifacts
          merge-multiple: true
      - name: Publish binaries and SHA-256 checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="cross-code-v$RELEASE_VERSION"
          (cd artifacts && sha256sum cross-code-darwin-arm64.tar.gz cross-code-linux-x64.tar.gz > SHA256SUMS)
          if release=$(gh release view "$tag" --json isDraft,targetCommitish 2>/dev/null); then
            target=$(git ls-remote origin "refs/tags/$tag" "refs/tags/${tag}^{}" | tail -n 1 | cut -f1)
            target="${target:-$(jq -r .targetCommitish <<< "$release")}"
            test "$target" = "$GITHUB_SHA"
            if jq -e .isDraft <<< "$release" > /dev/null; then
              gh release upload "$tag" --clobber artifacts/*.tar.gz artifacts/SHA256SUMS
              gh release edit "$tag" --draft=false --prerelease
            fi
            exit 0
          fi
          target=(--target "$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            target=(--verify-tag)
          fi
          gh release create "$tag" "${target[@]}" --draft --prerelease \
            --title "$tag" --notes-file CROSS-CODE.md artifacts/*.tar.gz artifacts/SHA256SUMS
          gh release edit "$tag" --draft=false --prerelease
